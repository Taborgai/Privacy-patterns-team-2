<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HIDE Group – Privacy Pattern Network</title>
  <script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    #infoBox {
      width: 420px;
      height: 480px;
      padding: 20px;
      background: #f7f7f7;
      border: 6px solid #7497d0; 
      overflow-y: auto;
      margin: 40px 0 0 40px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    #infoBox img {
      width: 100%;
      height: auto;
      max-height: 380px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 10px;
}

    #cy {
      flex: 1;
      height: 100vh;
      background: #ffffff;
    }
    h3 { margin: 0 0 10px; }
    p { margin: 0 0 10px; font-size: 14px; }

    #zoomSlider {
      width: 120px;
      accent-color: #41424a
    
    }

    
  </style>
</head>
<body>
    <button onclick="window.location.href='Level1.html'" style="position:absolute; top:10px; right:10px; z-index:10;">← Back to Overview</button>
  <div id="infoBox">
  <img id="infoImage" src="images/hide.png" alt="Pattern image" />
  <h3 id="infoTitle">Click on a pattern</h3>
  <p id="infoDescription">You'll see the description here.</p>
</div>

  <div id="cy"></div>

  <div style="position: fixed; top: 60px; right: 20px; background: white; padding: 6px 10px; border-radius: 6px; box-shadow: 0 0 6px rgba(0,0,0,0.2); font-family: sans-serif; z-index: 1000;">
    <label for="zoomSlider">Zoom / Granularity: <span id="zoomValue">1</span></label>
    <input type="range" id="zoomSlider" min="0.5" max="3" step="0.1" value="1" />
  </div>

  <script>
    const patternDescriptions = {
      h1: 'Get rid of troublemakers without even knowing who they are.',
      h2: 'Add some noise to service operation measurements, but make it cancel itself in the long-term.',
      h3: 'Use encryption in such a way that the service provider cannot decrypt the users information because the user manages the keys.',
      h4: 'Aggregate usage records at the user side in a trustworthy manner.',
      h5: 'Attribute Based Credentials (ABC) are a form of authentication mechanism that allows to flexibly and selectively authenticate different attributes about an entity without revealing additional information about the entity (zero-knowledge property).',
      h6: 'A messaging service is enhanced by using a trusted third party to exchange the identifiers of the communication partners by pseudonyms.',
      h7: 'Hide the identity by using a pseudonym and ensure a pseudonymous identity that can not be linked with a real identity during online interactions.',
      h8: 'Encrypt, aggregate and decrypt at different places.',
      h9: 'This pattern hides the actions taken by a user by adding fake actions that are indistinguishable from real.',
      h10: 'This pattern aggregate multiple entities into a set, such that they cannot be distinguised anymore.',
      h11: 'This pattern provides unlinkability between senders and receivers by encapsulating the data in different layers of encryption, limiting the knowledge of each node along the delivery path.',
    };

    const patternImages = {
        h1: "images/hide1.png",
        h2: "images/hide2.png",
        h3: "images/hide3.png",
        h4: "images/hide4.png",
        h5: "images/hide5.png",
        h6: "images/hide6.png",
        h7: "images/hide7.png",
        h8: "images/hide8.png",
        h9: "images/hide9.png",
        h10: "images/hide10.png",
        h11:"images/hide11.png",

    };
    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [
        // Nodes
        { data: { id: 'h1', label: 'Anonymous Reputation-based Blacklisting' } },
        { data: { id: 'h2', label: 'Added-noise measurement obfuscation' } },
        { data: { id: 'h3', label: 'Encryption with user-managed keys' } },
        { data: { id: 'h4', label: 'Trustworthy Privacy Plug-in' } },
        { data: { id: 'h5', label: 'Attribute Based Credentials' } },
        { data: { id: 'h6', label: 'Pseudonymous Messaging' } },
        { data: { id: 'h7', label: 'Pseudonymous Identity' } },
        { data: { id: 'h8', label: 'Aggregation Gateway' } },
        { data: { id: 'h9', label: 'Use of dummies' } },
        { data: { id: 'h10', label: 'Anonymity Set' } },
        { data: { id: 'h11', label: 'Onion Routing' } },

       

      ],
      style: [
        {
          selector: 'node',
          style: {
            'label': 'data(label)',
            'background-color': 'grey',
            'color': 'black',
            'text-valign': 'bottom',
            'text-halign': 'center',
            'text-margin-y': 8,
            'width': 12,
            'height': 12,
            'font-size': 8,
            'text-outline-color': 'grey',
            'text-outline-width': 0
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 1,
            'line-color': 'transparent',
            
            'target-arrow-color': 'transparent',
            'curve-style': 'bezier'
          }
        },
        {
          selector: '.highlight',
          style: {
            'background-color': '#7497d0',
            'text-outline-color': '#7497d0'
          }
        },
        
        
        {
  selector: 'node.highlight',
  style: {
    'border-width': 4,
    'border-color': '#7497d0',     // o cualquier color según el grupo
    'border-opacity': 1,
    'background-color': '#ffffff', // blanco al centro
    'background-opacity': 1,
    'overlay-padding': 6,
    'overlay-color': '#ffffff',
    'overlay-opacity': 0
  }
}

      ],
      layout: {
        name: 'circle',
  fit: true,               // que se ajuste al contenedor
  padding: 10,             // menos espacio alrededor
  avoidOverlap: true,      
  nodeSpacing: 5,          // más compacto
  radius: 200,             // círculo más pequeño
  startAngle: 3 / 2 * Math.PI,  // opcional: empieza arriba
  clockwise: true,
  animate: true
      },

      userZoomingEnabled: true,
      userPanningEnabled: true,
      boxSelectionEnabled: true,
      autoungrabify: false
    });
    
    const zoomSlider = document.getElementById("zoomSlider");
    const zoomValue = document.getElementById("zoomValue");

    zoomSlider.addEventListener("input", function () {
      const zoomLevel = parseFloat(this.value);
      cy.zoom(zoomLevel);
      cy.center(); // opcional: centra el grafo cada vez que haces zoom
      zoomValue.textContent = zoomLevel.toFixed(1);
    });

    const infoBox = document.getElementById('infoBox');

   cy.on('mouseover', 'node', function(evt) {
  const id = evt.target.id();
  const node = cy.getElementById(id);

  // Limpiar resaltado anterior
  cy.elements().removeClass('highlight linkHighlight');

  // Resaltar nodo actual y sus conexiones
  node.addClass('highlight');
  node.connectedEdges().addClass('linkHighlight');
  node.connectedEdges().connectedNodes().addClass('highlight');

  // Actualizar la imagen, título y descripción
  const title = node.data('label');
  const desc = patternDescriptions[id] || "No description.";
  const image = patternImages[id] || "images/default.png";

  document.getElementById("infoTitle").innerText = title;
  document.getElementById("infoDescription").innerText = desc;
  document.getElementById("infoImage").src = image;
});


cy.on('mouseout', 'node', function() {
  
  // Elimina solo el resaltado visual, pero deja el infoBox igual
  cy.elements().removeClass('highlight linkHighlight');
});

  </script>
</body>
</html>
